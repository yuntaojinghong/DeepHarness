[package]
name = "deepharness"
version = "1.0.0-alpha.1"
description = "DeepHarness — 零配置的 AI Agent 桌面工作台"
authors = ["DeepHarness"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "deepharness_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
base64 = "0.22"
tracing-appender = "0.2"

# DeepHarness Native Agent（阶段 4）
[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

# .dph-plugin 插件包是 zip。只开 deflate 特性：
# - 默认特性会拉进 bzip2 / zstd 两个 C 依赖（要 C 编译器、编译更慢），
#   而我们只需要最常见的 deflate；
# - deflate 走 flate2 的纯 Rust 后端（miniz_oxide），该 crate 本来就在
#   Tauri 的依赖树里，不引入新的原生依赖。
[dependencies.zip]
version = "2.6"
default-features = false
features = ["deflate"]

[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
tempfile = "3"

# 发布体积控制：安装包有 ≤30MB 的硬约束，而 Tauri 默认 release 配置
# 会把符号表和调试信息一起留下（exe 常到 15MB 以上）。
# - opt-level = "z"  ：面向体积优化（含 LLVM 的体积向内联策略）
# - lto = "thin"     ：跨 crate 裁剪未用代码；thin 相比 fat 编译快得多，
#                      对最终体积的影响通常只有几 MB 量级
# - strip = true     ：剥掉符号表（cargo 1.59+ 原生支持，无需外部 strip）
# - codegen-units=1  ：保留默认以外的单单元编译会让链接阶段过慢，故不动
[profile.release]
opt-level = "z"
lto = "thin"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# tauri-build 的 cargo_toml 解析要求该表存在（可为空）
[package.metadata]

[package.metadata.tauri-winres]


