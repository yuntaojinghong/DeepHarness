name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 使用 npmmirror 镜像
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

  rust:
    name: Rust 后端编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 使用 npmmirror 镜像
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 配置 rsproxy 镜像
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [registries.rsproxy]
          index = "https://rsproxy.cn/crates.io-index"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: 编译检查
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: 就位测试所需的原生 DLL
        shell: pwsh
        working-directory: src-tauri
        run: |
          # 测试二进制位于 target/debug/deps/，而 WebView2Loader.dll 由
          # webview2-com-sys 的 build script 产出到 OUT_DIR，必须复制到
          # 测试 exe 旁边，否则加载阶段直接 STATUS_ENTRYPOINT_NOT_FOUND。
          New-Item -ItemType Directory -Force -Path target/debug/deps | Out-Null
          Get-ChildItem -Path target/debug/build -Recurse -Filter "WebView2Loader.dll" |
            ForEach-Object { Copy-Item $_.FullName -Destination target/debug/deps -Force }
          Get-ChildItem target/debug/deps -Filter "WebView2Loader.dll" | ForEach-Object { $_.FullName }

      - name: 运行测试
        working-directory: src-tauri
        run: cargo test
