name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 使用 npmmirror 镜像
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

  rust:
    name: Rust 后端编译
    runs-on: windows-latest
    env:
      # Windows runner 上的 Python 默认按 cp1252（charmap）编码 stdout，
      # 步骤里任何中文输出都会抛 UnicodeEncodeError 并被判为失败。
      # 强制 UTF-8 模式，与下面各 python 步骤里的 reconfigure 形成双保险。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 使用 npmmirror 镜像
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 配置 rsproxy 镜像
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [registries.rsproxy]
          index = "https://rsproxy.cn/crates.io-index"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: 编译检查
        working-directory: src-tauri
        run: cargo check --all-targets

      # 只编译不运行，并把 cargo 实际产出的测试可执行文件路径记到
      # target/debug/deps/ci-test-binaries.txt：后续步骤据此校验清单，
      # 避免被 Cargo 缓存还原回来的历史产物干扰。
      - name: 编译测试二进制并记录其路径
        working-directory: src-tauri
        shell: python
        run: |
          import json, os, subprocess, sys

          # 不依赖 runner 的默认编码：显式切 UTF-8（见 job 级 env 的说明）。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          TARGETS = [["--lib"], ["--test", "public_api"]]
          executables = []

          for args in TARGETS:
              proc = subprocess.run(
                  ["cargo", "test", "--no-run", "--message-format=json"] + args,
                  capture_output=True, text=True, encoding="utf-8", errors="replace",
              )
              for line in proc.stdout.splitlines():
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      msg = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if msg.get("reason") == "compiler-artifact" and msg.get("executable"):
                      exe = msg["executable"]
                      # build script 自身的可执行文件不需要清单，排除掉
                      if not os.path.basename(exe).startswith("build-script"):
                          executables.append(exe)
              if proc.returncode != 0:
                  sys.stderr.write(proc.stderr[-6000:])
                  sys.exit("cargo test --no-run %s 失败" % " ".join(args))

          executables = sorted(set(executables))
          if not executables:
              sys.exit("没有编译出任何测试可执行文件")
          os.makedirs("target/debug/deps", exist_ok=True)
          with open("target/debug/deps/ci-test-binaries.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(executables))
          for exe in executables:
              print("test binary:", exe)

      - name: 就位测试所需的原生 DLL
        shell: pwsh
        working-directory: src-tauri
        run: |
          # 测试二进制位于 target/debug/deps/，而 WebView2Loader.dll 由
          # webview2-com-sys 的 build script 产出到 OUT_DIR，必须复制到
          # 测试 exe 旁边，否则加载阶段直接 STATUS_DLL_NOT_FOUND。
          New-Item -ItemType Directory -Force -Path target/debug/deps | Out-Null
          Get-ChildItem -Path target/debug/build -Recurse -Filter "WebView2Loader.dll" |
            ForEach-Object { Copy-Item $_.FullName -Destination target/debug/deps -Force }
          Get-ChildItem target/debug/deps -Filter "WebView2Loader.dll" | ForEach-Object { $_.FullName }

      # 回归哨兵：tao 静态导入 comctl32.dll!TaskDialogIndirect，该符号只有
      # Common-Controls v6（WinSxS 侧装程序集）导出。测试可执行文件若没有
      # 应用清单，loader 会绑定 System32 的 comctl32 5.82，入口点解析失败 →
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139)，一行测试都不会执行。
      # 这里直接检查每个测试 exe 的 RT_MANIFEST 资源，把该故障变成明确报错，
      # 而不是等到运行测试时收到一个没有上下文的退出码。
      - name: 校验测试二进制的应用清单
        working-directory: src-tauri
        shell: python
        run: |
          import os, struct, sys

          # 不依赖 runner 的默认编码：显式切 UTF-8（见 job 级 env 的说明）。
          # 否则校验通过时的中文成功提示反而会把步骤打成失败。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          LIST = "target/debug/deps/ci-test-binaries.txt"
          RT_MANIFEST = 24
          REQUIRED = ["Microsoft.Windows.Common-Controls", "6.0.0.0"]

          def read_pe(path):
              data = open(path, "rb").read()
              e = struct.unpack_from("<I", data, 0x3C)[0]
              if data[e:e+4] != b"PE\x00\x00":
                  raise ValueError("not a PE file")
              machine, nsec, _, _, _, szopt, _ = struct.unpack_from("<HHIIIHH", data, e + 4)
              opt = e + 24
              magic = struct.unpack_from("<H", data, opt)[0]
              ddir = opt + (112 if magic == 0x20B else 96)
              dirs = [struct.unpack_from("<II", data, ddir+i*8) for i in range(16)]
              secoff = opt + szopt
              secs = []
              for i in range(nsec):
                  o = secoff + i*40
                  vs, va, rs, pr = struct.unpack_from("<IIII", data, o+8)
                  secs.append((va, max(vs, rs), pr))
              def r2o(rva):
                  for va, sz, pr in secs:
                      if va <= rva < va + sz:
                          return pr + (rva - va)
                  return None
              return data, dirs, r2o

          def entries(data, base, off):
              n_named, n_id = struct.unpack_from("<HH", data, off + 12)
              out = []
              for i in range(n_named + n_id):
                  eo = off + 16 + i*8
                  name, sub = struct.unpack_from("<II", data, eo)
                  out.append((name, sub))
              return out

          def manifests(path):
              """返回 exe 内全部 RT_MANIFEST 资源的字节内容。"""
              data, dirs, r2o = read_pe(path)
              found = []
              if not dirs[2][0]:
                  return found
              base = r2o(dirs[2][0])
              for tname, toff in entries(data, base, base):
                  if not (toff & 0x80000000):
                      continue
                  for _n, noff in entries(data, base, base + (toff & 0x7FFFFFFF)):
                      if not (noff & 0x80000000):
                          continue
                      for _l, loff in entries(data, base, base + (noff & 0x7FFFFFFF)):
                          if loff & 0x80000000:
                              continue
                          drva, dsize = struct.unpack_from("<II", data, base + loff)
                          o = r2o(drva)
                          blob = data[o:o+dsize]
                          if tname & 0x80000000:
                              # 命名资源类型：只认名字为 MANIFEST 的项
                              so = r2o(tname & 0x7FFFFFFF)
                              n = struct.unpack_from("<H", data, so)[0]
                              label = data[so+2:so+2+n*2].decode("utf-16-le", "replace")
                              if label.upper() != "MANIFEST":
                                  continue
                          elif tname != RT_MANIFEST:
                              continue
                          found.append(blob)
              return found

          if not os.path.isfile(LIST):
              sys.exit("缺少测试二进制清单文件 %s（编译步骤未成功）" % LIST)
          targets = [l.strip() for l in open(LIST, encoding="utf-8") if l.strip()]
          if not targets:
              sys.exit("测试二进制清单为空")

          problems = []
          for exe in targets:
              name = os.path.basename(exe)
              if not os.path.isfile(exe):
                  problems.append("%s: 文件不存在" % name)
                  continue
              try:
                  blobs = manifests(exe)
              except Exception as exc:
                  problems.append("%s: 无法解析 PE 资源（%s）" % (name, exc))
                  continue
              if not blobs:
                  problems.append("%s: 没有嵌入 RT_MANIFEST 资源" % name)
                  continue
              text = b"".join(blobs).decode("utf-8", "replace")
              missing = [n for n in REQUIRED if n not in text]
              if missing:
                  problems.append("%s: 清单缺少 %s" % (name, ", ".join(missing)))
              else:
                  print("OK   %s: 已嵌入 Common-Controls v6 清单（%d 字节）" % (name, len(text)))

          if problems:
              print("\n发现 %d 个问题：" % len(problems))
              for p in problems:
                  print("!!! " + p)
              sys.exit(1)
          print("\n全部测试可执行文件的应用清单校验通过")

      - name: 运行测试
        working-directory: src-tauri
        run: |
          cargo test --lib
          cargo test --test public_api

  # 打包与上面两个 job 并行：release 编译不复用 debug 的 target 缓存，
  # 串行只会白白多等前面几分钟。这里只要产出一个能装的安装包。
  package:
    name: 打包 Windows 安装程序
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 使用 npmmirror 镜像
        run: npm config set registry https://registry.npmmirror.com

      # tauri build 会自己跑 beforeBuildCommand（npm run build），
      # 这里只装依赖，不重复构建前端。
      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 配置 rsproxy 镜像
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [registries.rsproxy]
          index = "https://rsproxy.cn/crates.io-index"

          [net]
          git-fetch-with-cli = true
          EOF

      # 独立于 debug 的缓存键：target/release 与 target/debug 的产物不通用，
      # 混在一个 key 下会让两边互相挤掉、都命中不了。
      - name: 缓存 Cargo（release）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: 构建 NSIS 安装程序
        run: npm run tauri build

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle |
            ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.FullName }

      # if-no-files-found 用 error 而非 warn：产物缺失必须让这个 job 红掉，
      # 否则会出现「CI 全绿但没有安装包」这种最坏情况。
      - name: 上传安装程序
        uses: actions/upload-artifact@v4
        with:
          name: DeepHarness-setup-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # 随包资源（Node 便携版 + dsh）单独成 job，而不是塞进 package：
  #   1. 两者互不影响 —— 资源下载失败时安装包仍能产出；
  #   2. 体积约束决定了它们只能旁路分发：node.exe 单文件就约 70MB，
  #      连同 dsh 的依赖树一起打进 NSIS，安装包会到 60-80MB，
  #      远超既定的 ≤30MB。刻意不写 bundle.resources，正是为了这个。
  # 运行时由 find_resource 在 exe 同级目录找 resources/，所以把本 job
  # 的产物解压到安装目录旁即可生效。
  package-resources:
    name: 导出随包资源（Node + dsh）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并安装 Node 便携版与 dsh
        shell: bash
        run: bash scripts/setup-resources.sh

      - name: 列出资源体积
        shell: pwsh
        run: |
          Get-ChildItem resources -Directory | ForEach-Object {
            $size = (Get-ChildItem $_.FullName -Recurse -File |
                     Measure-Object Length -Sum).Sum
            "{0,12:N0} 字节  {1}" -f $size, $_.FullName
          }

      - name: 上传随包资源
        uses: actions/upload-artifact@v4
        with:
          name: DeepHarness-resources-x64
          path: resources/**
          if-no-files-found: error
          retention-days: 30
