<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DeepHarness">
  <!--
    与仓库根目录的 app-icon.svg 同源（同一份母题与几何），
    此处保留一份独立副本是因为 GitHub Pages 只发布 docs/ 目录。
    改动请两边同步，避免品牌图形分叉。
  -->
  <title>DeepHarness</title>
  <defs>
    <linearGradient id="dhBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242B3A" />
      <stop offset="1" stop-color="#151A24" />
    </linearGradient>
    <linearGradient id="dhRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E9BFF" />
      <stop offset="1" stop-color="#63C7BE" />
    </linearGradient>
  </defs>
  <!-- 底板圆角方 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dhBg)" />
  <!-- 挽具环（顶部 60° 开口） -->
  <path d="M 320 155.2 A 128 128 0 0 1 256 394 A 128 128 0 0 1 192 155.2"
        fill="none" stroke="url(#dhRing)" stroke-width="40" stroke-linecap="round" />
  <!-- 中心核心 -->
  <circle cx="256" cy="266" r="34" fill="#F4F7FB" />
  <!-- 顶部引导节点 -->
  <circle cx="256" cy="138" r="18" fill="url(#dhRing)" />
  <!-- 环上两个 Agent 节点 -->
  <circle cx="320" cy="376.8" r="12" fill="#DCE4F0" />
  <circle cx="192" cy="376.8" r="12" fill="#DCE4F0" />
</svg>
