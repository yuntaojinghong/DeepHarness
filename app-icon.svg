<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    DeepHarness 品牌图标
    母题：挽具（Harness）—— 一条开口的环，承载中心的智能核心，
    环上三个节点代表三个彼此独立的 Agent。
    配色克制：石墨深空底 + 钢蓝到青瓷的单一渐变，无霓虹。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242B3A"/>
      <stop offset="1" stop-color="#151A24"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E9BFF"/>
      <stop offset="1" stop-color="#63C7BE"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方，垂直渐变 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- 挽具环：顶部留 60° 开口，左右两段分别着色 -->
  <path d="M 320 155.2 A 128 128 0 0 1 256 394 A 128 128 0 0 1 192 155.2"
        fill="none" stroke="url(#ring)" stroke-width="40" stroke-linecap="round"/>

  <!-- 中心核心 -->
  <circle cx="256" cy="266" r="34" fill="#F4F7FB"/>

  <!-- 顶部开口处的引导节点 -->
  <circle cx="256" cy="138" r="18" fill="url(#ring)"/>

  <!-- 环上左下 / 右下的两个 Agent 节点 -->
  <circle cx="320" cy="376.8" r="12" fill="#DCE4F0"/>
  <circle cx="192" cy="376.8" r="12" fill="#DCE4F0"/>
</svg>
